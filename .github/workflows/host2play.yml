name: host2play 续期

on:
  schedule:
    - cron: '0 0,11,22 * * *'
    - cron: '30 5,16 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-renew:
    name: 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip curl wget
          echo "[INFO] Installing Google Chrome..."
          wget -q -O /tmp/google-chrome-stable_current_amd64.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb || (sudo apt-get install -f -y && sudo dpkg -i /tmp/google-chrome-stable_current_amd64.deb) || echo "[WARN] Chrome install continuing anyway"
          google-chrome --version 2>/dev/null || echo "[WARN] Chrome not found, trying chromedriver]"

      - name: 安装 Python 依赖
        working-directory: host2play-renew
        run: |
          python -m pip install --upgrade pip setuptools wheel --timeout 120
          echo "[INFO] Current requirements.txt:"
          cat requirements.txt
          echo "[INFO] Installing dependencies with --no-cache-dir..."
          pip install -r requirements.txt --no-cache-dir --timeout 180
          echo "[INFO] Verifying seleniumbase installation..."
          python -c "from seleniumbase import SB; print('✓ seleniumbase SB class available')" || { echo "❌ seleniumbase SB import failed"; exit 1; }
          pip list | grep -i seleniumbase
          echo "[INFO] All installed packages:"
          pip freeze | head -20

      - name: 配置 DNS
        run: |
          echo "[INFO] 设置公共 DNS..."
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 1.0.0.1" | sudo tee /etc/resolv.conf
          sleep 1
          echo "[INFO] DNS 测试:"
          nslookup host2play.gratis 1.1.1.1 || echo "[WARN] 解析失败"
          echo "[INFO] 当前出口 IP:"
          curl -s --max-time 10 https://api.ipify.org && echo

      - name: 执行续期
        env:
          H2P_RENEW_URL: ${{ secrets.H2P_RENEW_URL }}
          H2P_COOKIE: ${{ secrets.H2P_COOKIE }}
          H2P_ACCOUNTS: ${{ secrets.H2P_ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        working-directory: host2play-renew
        run: |
          echo "[INFO] Working directory: $(pwd)"
          echo "[INFO] Files in directory:"
          ls -la
          echo "[INFO] Checking seleniumbase availability..."
          python -c "from seleniumbase import SB; print('SeleniumBase SB available')" || echo "⚠️ SeleniumBase NOT available (will retry in script)"
          echo "[INFO] Creating output directory..."
          mkdir -p output/screenshots
          echo "[INFO] Running main.py..."
          python main.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host2play-screenshots-${{ github.run_number }}
          path: host2play-renew/output/screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host2play-log-${{ github.run_number }}
          path: host2play-renew/renew.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 清理历史运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2