name: ACLClouds-卡卡续期

on:
  schedule:
    # UTC 01:00（北京时间 09:00）
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 requests
        run: pip install requests

      - name: 测试 Cookie 是否有效
        run: |
          echo "=== 开始测试 Cookie ==="
          python test_cookie.py
        env:
          ACL_COOKIES: ${{ secrets.ACL_COOKIES }}

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r ACLClouds-server/requirements.txt

      - name: 运行续期脚本
        env:
          ACL_COOKIES: ${{ secrets.ACL_COOKIES }}
          RENEW_THRESHOLD_HOURS: ${{ vars.RENEW_THRESHOLD_HOURS || '48' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python ACLClouds-server/renew.py
